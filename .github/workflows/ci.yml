name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merchantflow
          POSTGRES_USER: merchantflow
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merchantflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_ENVIRONMENT: test
      DJANGO_SECRET_KEY: insecure-ci-only
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://merchantflow:ci_only_password@127.0.0.1:5432/merchantflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --no-input
      - run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Production settings pass the deploy check
        run: |
          set -a; . ./.env.production.example; set +a
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python manage.py check --deploy --fail-level WARNING
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merchantflow
          POSTGRES_USER: merchantflow
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merchantflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_PYTHON: python
      # The server under test runs as a least-privilege runtime role; the owner
      # role migrates and seeds (see frontend/playwright.config.ts).
      E2E_RUNTIME_ROLE: mf_runtime
      SUPERUSER_URL: postgres://merchantflow:ci_only_password@127.0.0.1:5432/merchantflow
      DB_NAME: merchantflow_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Create separate owner and runtime database roles
        run: |
          OWNER_PW="$(openssl rand -hex 16)"; RUNTIME_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$RUNTIME_PW"
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE mf_owner LOGIN PASSWORD '$OWNER_PW'" \
            -c "CREATE ROLE mf_runtime LOGIN PASSWORD '$RUNTIME_PW'" \
            -c "CREATE DATABASE $DB_NAME OWNER mf_owner"
          echo "OWNER_URL=postgres://mf_owner:$OWNER_PW@127.0.0.1:5432/$DB_NAME" >> "$GITHUB_ENV"
          echo "RUNTIME_URL=postgres://mf_runtime:$RUNTIME_PW@127.0.0.1:5432/$DB_NAME" >> "$GITHUB_ENV"
      - name: Point the browser tests at the two roles
        run: |
          echo "E2E_OWNER_DATABASE_URL=$OWNER_URL" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=$RUNTIME_URL" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  database-roles:
    # Separate LOGIN roles, as in production: the owner migrates, the runtime
    # role (what the application uses) must not be able to touch audit or
    # ownership protection. Passwords are generated per run and never committed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merchantflow
          POSTGRES_USER: merchantflow
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merchantflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_ENVIRONMENT: test
      DJANGO_SECRET_KEY: insecure-ci-only
      DJANGO_DEBUG: "true"
      SUPERUSER_URL: postgres://merchantflow:ci_only_password@127.0.0.1:5432/merchantflow
      DB_NAME: merchantflow_roles
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create separate owner and runtime database roles
        run: |
          OWNER_PW="$(openssl rand -hex 16)"; RUNTIME_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$RUNTIME_PW"
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE mf_owner LOGIN PASSWORD '$OWNER_PW'" \
            -c "CREATE ROLE mf_runtime LOGIN PASSWORD '$RUNTIME_PW'" \
            -c "CREATE DATABASE $DB_NAME OWNER mf_owner"
          echo "OWNER_URL=postgres://mf_owner:$OWNER_PW@127.0.0.1:5432/$DB_NAME" >> "$GITHUB_ENV"
          echo "RUNTIME_URL=postgres://mf_runtime:$RUNTIME_PW@127.0.0.1:5432/$DB_NAME" >> "$GITHUB_ENV"
      - name: Migrate as the owner role
        run: DATABASE_URL="$OWNER_URL" python manage.py migrate --no-input
      - name: Grant runtime privileges, as the owner role
        run: DATABASE_URL="$OWNER_URL" python manage.py grant_runtime_privileges --role mf_runtime
      - name: The runtime role passes verification
        run: DATABASE_URL="$RUNTIME_URL" python manage.py verify_database_roles
      - name: The owner role fails verification (negative control)
        run: |
          if DATABASE_URL="$OWNER_URL" python manage.py verify_database_roles; then
            echo "The owner role was accepted as a runtime role"; exit 1
          fi
      - name: Runtime role boundaries (forbidden actions refused, required ones work)
        run: DATABASE_URL="$RUNTIME_URL" python scripts/verify_runtime_role_boundaries.py
      - name: Production deploy check, connected as the runtime role
        run: |
          set -a; . ./.env.production.example; set +a
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          DATABASE_URL="$RUNTIME_URL" \
            python manage.py check --deploy --database default --fail-level WARNING
